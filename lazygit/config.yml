git:
  diffRenderers:
    - colorArg: always
      command: hunk pager
gui:
  mouseEvents: true
  theme:
    activeBorderColor:
      - "#b6927b"
    inactiveBorderColor:
      - "#625e5a"
    searchingActiveBorderColor:
      - "#b6927b"
    optionsTextColor:
      - "#b6927b"
    selectedLineBgColor:
      - "#282727"
    inactiveViewSelectedLineBgColor:
      - "#1d1c19"
    cherryPickedCommitFgColor:
      - "#181616"
    cherryPickedCommitBgColor:
      - "#b6927b"
    markedBaseCommitFgColor:
      - "#181616"
    markedBaseCommitBgColor:
      - "#b6927b"
    unstagedChangesColor:
      - "#b6927b"
    defaultFgColor:
      - "#c5c9c5"
