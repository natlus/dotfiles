git:
  diffRenderers:
    - colorArg: always
      command: hunk pager
gui:
  mouseEvents: true
  theme:
    activeBorderColor:
      - "#708090"
    inactiveBorderColor:
      - "#444444"
    searchingActiveBorderColor:
      - "#708090"
    optionsTextColor:
      - "#708090"
    selectedLineBgColor:
      - "#2a2a2a"
    inactiveViewSelectedLineBgColor:
      - "#191919"
    cherryPickedCommitFgColor:
      - "#101010"
    cherryPickedCommitBgColor:
      - "#708090"
    markedBaseCommitFgColor:
      - "#101010"
    markedBaseCommitBgColor:
      - "#708090"
    unstagedChangesColor:
      - "#708090"
    defaultFgColor:
      - "#cccccc"
